{{define "title"}}Add Patient — PatientTriage.ai{{end}}
{{define "content"}}
<div class="form-container">
    <div class="glass-card form-card">
        <div class="panel-header">
            <h2>Register New Patient</h2>
        </div>

        <div id="form-result"></div>

        <form hx-post="/patients/new" hx-target="#form-result" hx-swap="innerHTML" class="patient-form" id="patient-form">
            <!-- Patient Info -->
            <div class="form-section">
                <h3 class="form-section-title">Patient Information</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" required placeholder="e.g. John Smith">
                    </div>
                    <div class="form-group form-group-sm">
                        <label for="age">Age</label>
                        <input type="number" id="age" name="age" required min="0" max="120" placeholder="45">
                    </div>
                    <div class="form-group form-group-sm">
                        <label for="sex">Sex</label>
                        <select id="sex" name="sex" required>
                            <option value="M">Male</option>
                            <option value="F">Female</option>
                            <option value="O">Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="chief_complaint">Chief Complaint</label>
                    <textarea id="chief_complaint" name="chief_complaint" required rows="2" placeholder="e.g. chest pain, shortness of breath"></textarea>
                </div>
            </div>

            <!-- Vitals -->
            <div class="form-section">
                <h3 class="form-section-title">Initial Vitals</h3>
                <div class="form-row vitals-grid">
                    <div class="form-group">
                        <label for="heart_rate">HR (bpm)</label>
                        <input type="number" id="heart_rate" name="heart_rate" required min="0" max="300" placeholder="80">
                    </div>
                    <div class="form-group">
                        <label for="respiratory_rate">RR (/min)</label>
                        <input type="number" id="respiratory_rate" name="respiratory_rate" required min="0" max="80" placeholder="16">
                    </div>
                    <div class="form-group">
                        <label for="spo2">SpO2 (%)</label>
                        <input type="number" id="spo2" name="spo2" required min="0" max="100" step="0.1" placeholder="98">
                    </div>
                    <div class="form-group">
                        <label for="systolic_bp">SBP (mmHg)</label>
                        <input type="number" id="systolic_bp" name="systolic_bp" required min="0" max="300" placeholder="120">
                    </div>
                    <div class="form-group">
                        <label for="diastolic_bp">DBP (mmHg)</label>
                        <input type="number" id="diastolic_bp" name="diastolic_bp" required min="0" max="200" placeholder="80">
                    </div>
                    <div class="form-group">
                        <label for="temperature">Temp (°C)</label>
                        <input type="number" id="temperature" name="temperature" required min="30" max="45" step="0.1" placeholder="37.0">
                    </div>
                    <div class="form-group">
                        <label for="gcs">GCS (3-15)</label>
                        <input type="number" id="gcs" name="gcs" required min="3" max="15" placeholder="15">
                    </div>
                    <div class="form-group">
                        <label for="pain_level">Pain (0-10)</label>
                        <input type="number" id="pain_level" name="pain_level" required min="0" max="10" placeholder="0">
                    </div>
                </div>
            </div>

            <!-- Assessment -->
            <div class="form-section">
                <h3 class="form-section-title">Initial Assessment</h3>
                <div class="form-row checkbox-row">
                    <label class="checkbox-label">
                        <input type="checkbox" id="can_walk" name="can_walk" value="true" checked>
                        <span class="checkbox-custom"></span>
                        Can Walk
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="is_breathing" name="is_breathing" value="true" checked>
                        <span class="checkbox-custom"></span>
                        Is Breathing
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="follows_commands" name="follows_commands" value="true" checked>
                        <span class="checkbox-custom"></span>
                        Follows Commands
                    </label>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-lg" id="btn-submit-patient">
                    Register & Triage Patient
                </button>
                <a href="/" class="btn btn-outline btn-lg">Cancel</a>
            </div>
        </form>
    </div>
</div>
{{end}}
